services:
  # Service PHP-FPM
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # args:
      #   USER: symfony
      #   USER_ID: 1000
      #   GROUP_ID: 1000
    volumes:
      - ./:/var/www/symfony
      - ./vendor:/var/www/symfony/vendor:delegated

    healthcheck:
      test: [ "CMD", "ping", "-h", "localhost" ]
      timeout: 20s
      interval: 10s
      retries: 10

    environment:
      - APP_ENV=${APP_ENV:-prod}
      - DATABASE_URL=mysql://ue8t5vjaz1rhvrkj:sMaDfFPkUjKaO4RdAndk@bztk5ekzudeux7v5tznc-mysql.services.clever-cloud.com:3306/bztk5ekzudeux7v5tznc?serverVersion=8.0
    networks:
      - symfony

  # Service Nginx
  nginx:
    image: nginx:stable-alpine
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./:/var/www/symfony
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - symfony

networks:
  symfony:
    driver: bridge
