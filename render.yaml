services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.render
    env: 
      - NODE_VERSION=18.12.1
    buildCommand: echo "Build terminé avec succès!"
    # Le port est géré automatiquement par Render
    startCommand: /entrypoint.sh
    healthCheckPath: /test.html
    healthCheckTimeout: 5
    autoDeploy: false