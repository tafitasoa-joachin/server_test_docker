# version: '3.8'

services:
  # Service PHP-FPM
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER: symfony
        USER_ID: 1000
        GROUP_ID: 1000
    volumes:
      - ./:/var/www/symfony
      - ./vendor:/var/www/symfony/vendor:delegated
    depends_on:
      - database
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - DATABASE_URL=mysql://root:03302joachin@database:3306/test_server_docker?serverVersion=8.0
    networks:
      - symfony

  # Service Nginx
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/symfony
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - symfony

  # Service MySQL
  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 03302joachin
      MYSQL_DATABASE: test_server_docker
      MYSQL_USER: symfony
      MYSQL_PASSWORD: 03302joachin
      MYSQL_ROOT_HOST: '%'
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - symfony

volumes:
  db-data:


networks:
  symfony:
    driver: bridge
